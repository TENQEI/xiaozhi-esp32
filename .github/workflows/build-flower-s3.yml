name: Build Flower S3

on:
  workflow_dispatch:
  push:
    branches: [main, feat/flower-s3]
    paths:
      - main/boards/flower-s3/**
      - main/application.*
      - main/notify/**
      - main/boards/common/board.h
      - main/CMakeLists.txt
      - scripts/prepare_flower_chimes.py
      - scripts/tests/test_flower_chime.py
      - scripts/tests/test_flower_random.py
      - scripts/tests/test_flower_web.py
      - scripts/tests/test_flower_calendar.py
      - scripts/tests/test_notify_player.py
      - .github/workflows/build-flower-s3.yml

permissions:
  contents: read

concurrency:
  group: flower-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Build Chinese firmware with voice wake-up
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py flower-s3 --name flower-s3 --language zh-CN --zip
      - name: Test time schedules and calendar with SDK cJSON
        run: python -m unittest discover -s scripts/tests -p 'test_flower_*.py' -v
      - name: Upload flashable firmware
        uses: actions/upload-artifact@v7
        with:
          name: flower-s3-zh-CN-${{ github.sha }}
          path: |
            build/merged-binary.bin
            releases/*_flower-s3.zip
          if-no-files-found: error
      - name: Build combined chime, greeting and random phrase test packs
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("build/ci-chimes")
          root.mkdir(parents=True, exist_ok=True)
          for hour in range(24):
              shutil.copyfile("main/assets/locales/zh-CN/1.ogg", root / f"{hour:02d}.ogg")
          (root / "chime-config.json").write_text('{"enabled":false,"quiet_start":20,"quiet_end":8}')
          phrases = Path("build/ci-phrases")
          phrases.mkdir(parents=True, exist_ok=True)
          for group in ("common", "morning", "afternoon", "evening"):
              folder = phrases / group
              folder.mkdir(exist_ok=True)
              for index in range(4):
                  shutil.copyfile(f"main/assets/locales/zh-CN/{index}.ogg", folder / f"phrase-{index}.ogg")
          greetings = Path("build/ci-greetings")
          greetings.mkdir(parents=True, exist_ok=True)
          for name in ("good_morning", "good_night"):
              shutil.copyfile("main/assets/locales/zh-CN/1.ogg", greetings / f"{name}.ogg")
          PY
          idf.py -D FLOWER_CHIME_SOURCE_DIR="$PWD/build/ci-chimes" -D FLOWER_RANDOM_SOURCE_DIR="$PWD/build/ci-phrases" -D FLOWER_GREETING_SOURCE_DIR="$PWD/build/ci-greetings" reconfigure
          idf.py build
