name: Build Flower S3

on:
  workflow_dispatch:
  push:
    branches: [main, feat/flower-s3]
    paths:
      - main/boards/flower-s3/**
      - main/application.*
      - main/notify/**
      - main/audio/session_lifecycle.h
      - main/assets/flower/**
      - scripts/gen_flower_audio.py
      - scripts/generate_flower_placeholders.py
      - scripts/verify_flower_firmware.py
      - scripts/tests/test_flower_*.py
      - main/boards/common/board.h
      - main/CMakeLists.txt
      - scripts/prepare_flower_chimes.py
      - scripts/tests/test_notify_player.py
      - .github/workflows/build-flower-s3.yml

permissions:
  contents: read

concurrency:
  group: flower-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Install audio validation tools
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg g++ binutils libcjson-dev libmbedtls-dev
      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Build Chinese firmware with voice wake-up
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py flower-s3 --name flower-s3 --language zh-CN --zip
      - name: Verify embedded audio symbols and actual OTA budget
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/verify_flower_firmware.py
      - name: Test time schedules and calendar with SDK cJSON
        run: python -m unittest discover -s scripts/tests -p 'test_flower_*.py' -v
      - name: Upload flashable firmware
        uses: actions/upload-artifact@v7
        with:
          name: flower-s3-zh-CN-${{ github.sha }}
          path: |
            build/flower-audio-report.json
            build/xiaozhi.bin
            build/merged-binary.bin
            releases/*_flower-s3.zip
          if-no-files-found: error
      - name: Build long audio budget fixture
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          mkdir -p build/ci-flower
          python - <<'PYCODE'
          import json
          from pathlib import Path
          manifest = json.loads(Path("main/assets/flower/audio_manifest.json").read_text())
          for item in manifest["audio"]:
              item["placeholder"] = True
          Path("build/ci-flower/audio_manifest.json").write_text(json.dumps(manifest))
          PYCODE
          python scripts/generate_flower_placeholders.py --manifest build/ci-flower/audio_manifest.json --expected-duration
          idf.py -D FLOWER_AUDIO_SOURCE_DIR="$PWD/build/ci-flower" reconfigure
          idf.py build
          python scripts/verify_flower_firmware.py --manifest build/ci-flower/audio_manifest.json --output build/flower-long-audio-report.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flower-s3-validation-${{ github.sha }}
          path: build/flower*-audio-report.json
          if-no-files-found: warn
